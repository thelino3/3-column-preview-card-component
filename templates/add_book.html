{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Add a New Book</h4>
            </div>
            <div class="card-body">
                <!-- The action="/add-book" tells the form exactly where to send the data in app.py -->
                <form method="POST" action="/add-book">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Book Title</label>
                        <input type="text" name="title" class="form-control"
                            placeholder="e.g., Introduction to Algorithms" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Author Name</label>
                        <input type="text" name="author" class="form-control" placeholder="e.g., Thomas H. Cormen"
                            required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Category / Genre</label>
                        <input type="text" name="category" class="form-control" placeholder="e.g., Computer Science"
                            required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Total Copies</label>
                        <input type="number" name="copies" class="form-control" min="1" value="1" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fs-5">Save Book to Catalog</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
